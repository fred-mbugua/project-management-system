server {
    server_name projects.freestylecodetechnologies.com;

    client_max_body_size 50M;

    access_log /var/log/nginx/projects-access.log;
    error_log  /var/log/nginx/projects-error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/ssl/projects.freestylecodetechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/projects.freestylecodetechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    server_name projects.freestylecodetechnologies.com;
    listen 80;
    return 301 https://$host$request_uri;
}
